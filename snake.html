<!DOCTYPE html>
<html lang="ru">
<head>
<script>(function(){function fmt(a){if(a instanceof Error)return a.message;if(typeof a==="object"&&a!==null){try{return JSON.stringify(a)}catch(e){return String(a)}}return String(a)}function send(t,m,l){try{parent.postMessage({__stc:1,type:t,msg:m,line:l},"*")}catch(e){}}["log","info","warn","error"].forEach(function(m){var o=console[m];console[m]=function(){send(m,Array.prototype.map.call(arguments,fmt).join(" "));if(o)o.apply(console,arguments)}});window.addEventListener("error",function(e){send("error",e.message,e.lineno)});window.addEventListener("unhandledrejection",function(e){send("error","Promise: "+fmt(e.reason))});})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #E8E4DC;
    --card: #F2EFE9;
    --text: #1C1C1C;
    --hint: #6E6A63;
    --accent: #B8942E;
    --line: #D6D1C7;
    --edge: 20px;
    --btn: 54px;
    --gap: 5px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding-top: calc(var(--tg-content-safe-area-inset-top, 0px) + 12px);
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }
  #app::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,0,0,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.035) 1px, transparent 1px);
    background-size: 24px 24px; z-index: -1;
  }

  /* Шапка */
  header {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--edge);
    height: 40px;
    margin-top: 6px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  .pill {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--accent); color: #FFFFFF;
    font-size: 15px; font-weight: 600;
    padding: 0 16px; border-radius: 8px;
    text-decoration: none; font-family: inherit;
    border: none; line-height: 1;
    white-space: nowrap;
    height: 40px;
  }
  .pill:active { opacity: 0.8; }
  #score { font-variant-numeric: tabular-nums; }
  
  h1 {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px; font-weight: 600; margin: 0;
    letter-spacing: -0.02em;
    white-space: nowrap;
    line-height: 1;
  }

  /* Поле */
  #board-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 0; padding: 0 28px;
    margin-bottom: 10px;
  }
  canvas {
    background: var(--card);
    border: 1px solid var(--accent);
    border-radius: 12px;
    display: block;
    touch-action: none;
  }

  /* Крестовина (возвращена на место) */
  #pad {
    position: relative;
    width: calc(var(--btn) * 3 + var(--gap) * 2);
    height: calc(var(--btn) * 2 + var(--gap));
    margin: 0 auto 16px auto;
    flex-shrink: 0;
  }
  #pad button {
    position: absolute;
    width: var(--btn);
    height: var(--btn);
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    touch-action: manipulation;
    padding: 0;
    transform: scale(1);
    transition: transform 0.08s ease-out;
  }
  #pad button.pressed { transform: scale(0.9); }
  #pad button .arrow {
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-bottom: 13px solid var(--accent);
    display: block;
  }
  #pad button[data-dir="down"] .arrow {
    border-bottom: none;
    border-top: 13px solid var(--accent);
  }
  #pad button[data-dir="left"] .arrow {
    border-bottom: 9px solid transparent;
    border-top: 9px solid transparent;
    border-right: 13px solid var(--accent);
    border-left: none;
  }
  #pad button[data-dir="right"] .arrow {
    border-bottom: 9px solid transparent;
    border-top: 9px solid transparent;
    border-left: 13px solid var(--accent);
    border-right: none;
  }
  #pad button[data-dir="up"]    { left: calc(var(--btn) + var(--gap)); top: 0; }
  #pad button[data-dir="down"]  { left: calc(var(--btn) + var(--gap)); bottom: 0; }
  #pad button[data-dir="left"]  { left: 0; top: calc(var(--btn) / 2 + var(--gap) / 2); }
  #pad button[data-dir="right"] { right: 0; top: calc(var(--btn) / 2 + var(--gap) / 2); }

  /* Кнопка Сначала */
  #restart {
    display: block;
    width: 50%;
    margin: 0 auto;
    padding: 12px;
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    flex-shrink: 0;
  }
  #restart:active { opacity: 0.85; }

  /* Экран смерти */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(28,28,28,0.35);
    display: none; align-items: center; justify-content: center;
    padding: 24px; z-index: 10;
  }
  #overlay.show { display: flex; }
  
  #overlay .card {
    position: relative;
    background: var(--card);
    border: 2px solid var(--accent);
    border-radius: 16px;
    padding: 24px;
    width: 100%; max-width: 320px;
    display: flex;
    flex-direction: column;
    text-align: center;
  }
  
  .btn-home-top {
    position: absolute;
    top: 12px;
    left: 12px;
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    background: var(--accent); color: #FFFFFF;
    border-radius: 8px;
    text-decoration: none;
    z-index: 2;
  }
  .btn-home-top:active { opacity: 0.8; }
  .btn-home-top svg { width: 20px; height: 20px; fill: currentColor; }

  /* Заголовок ИГРА ОКОНЧЕНА (сдвинут вправо на 5px) */
  #overlay h2 {
    margin: 0 0 20px;
    font-size: 20px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    
    position: absolute;
    top: 12px;
    left: 5px; /* Сдвиг вправо */
    width: 100%;
    height: 36px;
    line-height: 36px;
    text-align: center;
    pointer-events: none;
  }

  .score-container {
    margin-top: 48px; 
    margin-bottom: 24px;
  }

  #overlay .big-score {
    font-size: 56px; font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin: 0 0 6px;
    font-variant-numeric: tabular-nums;
  }
  
  #overlay .score-label {
    font-size: 16px; color: var(--hint);
    margin: 0;
  }
  
  .overlay-buttons {
    display: flex;
    gap: 12px;
    margin-top: auto;
  }
  
  .overlay-buttons button {
    flex: 1 1 0;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    font-family: inherit;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    white-space: nowrap;
  }
  
  .btn-gray {
    background: var(--card);
    border: 1px solid var(--accent) !important;
    color: var(--accent);
  }
  .btn-gray:active { background: var(--line); }
  
  .btn-accent {
    background: var(--accent);
    border: 1px solid var(--accent) !important;
    color: #FFFFFF;
    gap: 6px;
  }
  .btn-accent:active { opacity: 0.85; }
  
  .revive-cost {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0.95;
  }
  .revive-cost svg {
    width: 14px;
    height: 14px;
    display: block;
    fill: #FFFFFF;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="pill" href="index.html">В меню</a>
    <h1>Змейка</h1>
    <div class="pill" id="score">Счёт: 0</div>
  </header>

  <div id="board-wrap">
    <canvas id="game"></canvas>
  </div>

  <div id="pad">
    <button type="button" data-dir="up"><span class="arrow"></span></button>
    <button type="button" data-dir="left"><span class="arrow"></span></button>
    <button type="button" data-dir="right"><span class="arrow"></span></button>
    <button type="button" data-dir="down"><span class="arrow"></span></button>
  </div>

  <button id="restart" type="button">Сначала</button>
</div>

<div id="overlay">
  <div class="card">
    <a class="btn-home-top" href="index.html" title="В меню">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    </a>
    
    <h2>Игра окончена</h2>
    
    <div class="score-container">
      <p class="big-score" id="final-score">0</p>
      <p class="score-label">ваш счёт</p>
    </div>
    
    <div class="overlay-buttons">
      <button class="btn-gray" id="again" type="button">Сначала</button>
      <button class="btn-accent" id="revive" type="button">
        <span>Воскреснуть</span>
        <span class="revive-cost">
          <span>5</span>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </span>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try {
      if (tg.isFullscreen && (!tg.contentSafeAreaInset || tg.contentSafeAreaInset.top === 0)) {
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', '60px');
      } else if (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top > 0) {
        document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', tg.contentSafeAreaInset.top + 'px');
      }
    } catch(e){}
  }

  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var overlay = document.getElementById('overlay');
  var finalScoreEl = document.getElementById('final-score');
  var boardWrap = document.getElementById('board-wrap');

  var COLS = 12, ROWS = 12;
  var START_SPEED = 180;
  var MIN_SPEED = 150; 
  var FOOD_APPEAR = 180;
  var FOOD_EAT = 140;
  var BORDER = 2;
  var GOLD_CHANCE = 0.025;
  var GOLD_GROWTH = 3;
  var GOLD_SCORE = 3;

  var cell = 0;
  var dpr = 1;
  var snake = null, prevSnake = null, dir, nextDir, food, score, alive;
  var stepTimer = null;
  var speed = START_SPEED;
  var foodAppear = 0;
  var foodEat = 0;
  var eatPos = null;
  var lastFrame = 0;
  var stepStart = 0;
  var stepDuration = START_SPEED;
  var particles = [];
  var pendingGrowth = 0;
  var segmentAlphas = [];
  var queuedDir = null;

  function haptic(type) {
    if (!tg || !tg.HapticFeedback) return;
    if (typeof tg.isVersionAtLeast === 'function' && !tg.isVersionAtLeast('6.1')) return;
    try {
      if (type === 'light') tg.HapticFeedback.impactOccurred('light');
      if (type === 'medium') tg.HapticFeedback.impactOccurred('medium');
      if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    } catch (e) {}
  }

  function fitCanvas() {
    var w = boardWrap.clientWidth;
    var h = boardWrap.clientHeight;
    var size = Math.min(w, h) - BORDER * 2;
    if (!size || size < 40) return;
    dpr = window.devicePixelRatio || 1;
    cell = Math.floor(size / COLS);
    if (cell < 4) return;
    var px = cell * COLS;
    canvas.style.width = px + 'px';
    canvas.style.height = px + 'px';
    canvas.width = Math.round(px * dpr);
    canvas.height = Math.round(px * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(0);
  }

  function cloneSnake(s) {
    var out = [];
    for (var i = 0; i < s.length; i++) out.push({x: s[i].x, y: s[i].y});
    return out;
  }

  function rollAlphas(length) {
    var arr = [];
    for (var i = 0; i < length; i++) {
      var t = length > 1 ? i / (length - 1) : 0;
      var base = 1 - t * 0.25;
      var jitter = (Math.random() - 0.5) * 0.12;
      var a = base + jitter;
      if (a < 0.6) a = 0.6;
      if (a > 1) a = 1;
      arr.push(a);
    }
    if (arr.length > 0) arr[0] = 1;
    return arr;
  }

  function buildCenterSnake(length) {
    var cx = Math.floor(COLS / 2) - 2;
    if (cx < 1) cx = 1;
    var cy = Math.floor(ROWS / 2);
    var out = [];
    for (var i = 0; i < length; i++) {
      var x = cx - i;
      if (x < 0) x = 0;
      out.push({x: x, y: cy});
    }
    return out;
  }

  function placeFood() {
    if (!snake) return;
    var guard = 0;
    while (guard < 1000) {
      guard++;
      var f = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
      var busy = false;
      for (var i = 0; i < snake.length; i++) {
        if (snake[i].x === f.x && snake[i].y === f.y) { busy = true; break; }
      }
      if (!busy) {
        food = {x: f.x, y: f.y, gold: Math.random() < GOLD_CHANCE};
        foodAppear = 0;
        return;
      }
    }
    food = {x: 0, y: 0, gold: false};
    foodAppear = 0;
  }

  function spawnParticles(cx, cy, gold) {
    var count = gold ? 12 : 7;
    var baseColor = gold ? '#D4A817' : '#C0453F';
    for (var i = 0; i < count; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = cell * (0.04 + Math.random() * 0.06);
      particles.push({
        x: cx * cell + cell / 2,
        y: cy * cell + cell / 2,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        life: 1,
        size: Math.max(2, cell * (0.06 + Math.random() * 0.05)),
        color: baseColor
      });
    }
  }

  function reset() {
    snake = [{x: 6, y: 6}, {x: 5, y: 6}, {x: 4, y: 6}];
    prevSnake = cloneSnake(snake);
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    queuedDir = null;
    score = 0;
    speed = START_SPEED;
    stepDuration = START_SPEED;
    alive = true;
    foodAppear = 0;
    foodEat = 0;
    eatPos = null;
    particles = [];
    pendingGrowth = 0;
    segmentAlphas = rollAlphas(snake.length);
    stepStart = performance.now();
    scoreEl.textContent = 'Счёт: 0';
    overlay.classList.remove('show');
    placeFood();
    if (stepTimer) clearInterval(stepTimer);
    stepTimer = setInterval(tick, speed);
    draw(0);
  }

  function revive() {
    if (!snake) { reset(); return; }
    var length = snake.length;
    snake = buildCenterSnake(length);
    prevSnake = cloneSnake(snake);
    dir = {x: 1, y: 0};
    nextDir = {x: 1, y: 0};
    queuedDir = null;
    alive = true;
    foodAppear = 0;
    foodEat = 0;
    eatPos = null;
    particles = [];
    pendingGrowth = 0;
    segmentAlphas = rollAlphas(snake.length);
    stepStart = performance.now();
    stepDuration = speed;
    overlay.classList.remove('show');
    if (!food) placeFood();
    if (stepTimer) clearInterval(stepTimer);
    stepTimer = setInterval(tick, speed);
    haptic('medium');
    draw(0);
  }

  function tick() {
    if (!alive || !snake) return;

    if (queuedDir) {
      nextDir = queuedDir;
      queuedDir = null;
    }

    prevSnake = cloneSnake(snake);
    stepStart = performance.now();
    stepDuration = speed;

    dir = nextDir;
    var head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      var gain = food.gold ? GOLD_SCORE : 1;
      score += gain;
      scoreEl.textContent = 'Счёт: ' + score;
      haptic('medium');
      eatPos = {x: food.x, y: food.y, gold: food.gold};
      foodEat = 0;
      spawnParticles(food.x, food.y, food.gold);
      if (food.gold) pendingGrowth += GOLD_GROWTH;
      food = null;
      foodAppear = 0;
      setTimeout(function () {
        if (alive) placeFood();
      }, FOOD_EAT);
      if (score % 5 === 0 && speed > MIN_SPEED) {
        speed = Math.max(MIN_SPEED, speed - 10);
        clearInterval(stepTimer);
        stepTimer = setInterval(tick, speed);
      }
    } else {
      if (pendingGrowth > 0) {
        pendingGrowth--;
      } else {
        snake.pop();
      }
    }

    if (segmentAlphas.length !== snake.length) {
      segmentAlphas = rollAlphas(snake.length);
    }
  }

  function gameOver() {
    alive = false;
    if (stepTimer) clearInterval(stepTimer);
    queuedDir = null;
    haptic('error');
    finalScoreEl.textContent = String(score);
    overlay.classList.add('show');
  }

  function render(now) {
    if (!lastFrame) lastFrame = now;
    var dt = now - lastFrame;
    lastFrame = now;

    if (food && foodAppear < 1) foodAppear = Math.min(1, foodAppear + dt / FOOD_APPEAR);
    if (foodEat < 1) foodEat = Math.min(1, foodEat + dt / FOOD_EAT);

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt / 16;
      p.y += p.vy * dt / 16;
      p.vy += cell * 0.004 * dt / 16;
      p.life -= dt / 500;
      if (p.life <= 0) particles.splice(i, 1);
    }

    var raw = Math.min(1, (now - stepStart) / stepDuration);
    draw(raw);
    requestAnimationFrame(render);
  }

  function draw(phase) {
    if (!cell || !snake) return;
    var px = cell * COLS;
    ctx.clearRect(0, 0, px, px);

    ctx.strokeStyle = 'rgba(0,0,0,0.05)';
    ctx.lineWidth = 1;
    for (var i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, px); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(px, i * cell + 0.5); ctx.stroke();
    }

    if (food) drawFood(food.x, food.y, easeOut(foodAppear), false, food.gold);
    if (eatPos && foodEat < 1) drawFood(eatPos.x, eatPos.y, 1 - easeIn(foodEat), true, eatPos.gold);

    for (var k = 0; k < particles.length; k++) {
      var pt = particles[k];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    var total = snake.length;
    for (var j = 0; j < total; j++) {
      var s = snake[j];
      var pv = prevSnake[j] || snake[j + 1] || s;
      var t = total > 1 ? j / (total - 1) : 0;
      var alpha = segmentAlphas[j] != null ? segmentAlphas[j] : (1 - t * 0.25);
      var taper = 1 - t * 0.35;
      var basePad = j === 0 ? 0.04 : (0.14 + t * 0.10);
      var pad = Math.max(2, Math.floor(cell * basePad * (j === 0 ? 1 : taper)));

      var fx = pv.x + (s.x - pv.x) * phase;
      var fy = pv.y + (s.y - pv.y) * phase;

      var x = fx * cell + pad;
      var y = fy * cell + pad;
      var w = cell - pad * 2;

      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#B8942E';
      roundRect(x, y, w, w, w * 0.34);
      ctx.fill();

      if (j === 0) drawEye(x, y, w, dir);
      ctx.globalAlpha = 1;
    }
  }

  function drawEye(hx, hy, hw, d) {
    var eyeSize = Math.max(3, Math.floor(hw * 0.34));
    var margin = Math.max(1, Math.floor(hw * 0.16));
    if (eyeSize > hw - margin * 2) eyeSize = Math.max(2, hw - margin * 2);
    var x, y;
    if (d.x === 1) { x = hx + hw - margin - eyeSize; y = hy + margin; }
    else if (d.x === -1) { x = hx + margin; y = hy + margin; }
    else if (d.y === -1) { x = hx + margin; y = hy + margin; }
    else { x = hx + hw - margin - eyeSize; y = hy + hw - margin - eyeSize; }

    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(x + eyeSize / 2, y + eyeSize / 2, eyeSize / 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFood(cx, cy, scale, isEat, gold) {
    if (scale <= 0) return;
    var pad = Math.max(2, Math.floor(cell * 0.16));
    var w = cell - pad * 2;
    var centerX = cx * cell + cell / 2;
    var centerY = cy * cell + cell / 2;
    var drawW = w * scale;
    var x = centerX - drawW / 2;
    var y = centerY - drawW / 2 + cell * 0.06;

    ctx.fillStyle = gold ? '#D4A817' : '#C0453F';
    roundRect(x, y, drawW, drawW, drawW * 0.32);
    ctx.fill();

    if (!isEat && scale > 0.6) {
      var stalkW = Math.max(2, Math.floor(cell * 0.08));
      var stalkH = Math.max(3, Math.floor(cell * 0.18));
      var stalkX = centerX - stalkW / 2;
      var stalkY = y - stalkH * 0.6;
      ctx.fillStyle = '#1C1C1C';
      ctx.fillRect(stalkX, stalkY, stalkW, stalkH);

      var leafW = Math.max(6, Math.floor(cell * 0.30));
      var leafH = Math.max(4, Math.floor(cell * 0.16));
      var leafX = stalkX + stalkW;
      var leafY = stalkY - leafH * 0.1;
      ctx.fillStyle = '#B8942E';
      ctx.beginPath();
      ctx.ellipse(leafX + leafW / 2, leafY + leafH / 2, leafW / 2, leafH / 2, -0.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function easeOut(t) { return 1 - (1 - t) * (1 - t); }
  function easeIn(t) { return t * t; }

  function roundRect(x, y, w, h, r) {
    if (w < 0) w = 0;
    if (h < 0) h = 0;
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function setDir(name) {
    if (!alive || !snake) return;
    var d;
    if (name === 'up') d = {x: 0, y: -1};
    else if (name === 'down') d = {x: 0, y: 1};
    else if (name === 'left') d = {x: -1, y: 0};
    else if (name === 'right') d = {x: 1, y: 0};
    else return;

    var ref = queuedDir || dir;
    if (d.x === -ref.x && d.y === -ref.y) return;
    if (d.x === ref.x && d.y === ref.y) return;

    queuedDir = d;
  }

  var padButtons = document.querySelectorAll('#pad button');
  for (var b = 0; b < padButtons.length; b++) {
    (function (btn) {
      btn.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        btn.classList.add('pressed');
        setDir(btn.getAttribute('data-dir'));
        haptic('medium');
      }, {passive: false});
      btn.addEventListener('pointerup', function () { btn.classList.remove('pressed'); });
      btn.addEventListener('pointercancel', function () { btn.classList.remove('pressed'); });
      btn.addEventListener('pointerleave', function () { btn.classList.remove('pressed'); });
    })(padButtons[b]);
  }

  var touchStart = null;
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { touchStart = null; return; }
    var t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive: true});

  document.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 'right' : 'left');
    else setDir(dy > 0 ? 'down' : 'up');
  }, {passive: true});

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w' || k === 'W') setDir('up');
    else if (k === 'ArrowDown' || k === 's' || k === 'S') setDir('down');
    else if (k === 'ArrowLeft' || k === 'a' || k === 'A') setDir('left');
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') setDir('right');
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);
  
  document.getElementById('revive').addEventListener('click', function () {
    var btn = this;
    if (!tg) { revive(); return; }
    btn.disabled = true;
  
    // Получаем ID пользователя Telegram
    var userId = tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null;
  
    if (!userId) {
        alert('Ошибка: Не удалось получить ID пользователя.');
        btn.disabled = false;
        return;
    }
  
    // 1. Просим сервер создать счет
    fetch('https://my-bot.oneminutegame.workers.dev/api/create-invoice', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: userId })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.ok) throw new Error('Server error');
      
      // 2. Открываем окно оплаты
      tg.openInvoice(data.link, function (status) {
        if (status === 'paid') {
          // 3. Если оплачено, ждем 2 секунды и проверяем базу
          setTimeout(function() {
            fetch('https://my-bot.oneminutegame.workers.dev/api/check-payment', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userId: userId })
            })
            .then(function (res) { return res.json(); })
            .then(function (checkData) {
              if (checkData.paid) {
                revive(); // База подтвердила — воскрешаем!
              } else {
                alert('Оплата еще обрабатывается. Попробуйте нажать "Воскреснуть" еще раз через пару секунд.');
                btn.disabled = false;
              }
            });
          }, 1000); // Пауза 2000 миллисекунд (2 секунды)
        } else {
          btn.disabled = false;
          haptic('error');
        }
      });
    }, 300)
    .catch(function (err) {
      alert('Не удалось создать счет. Проверьте интернет.');
      btn.disabled = false;
    });
  });

  window.addEventListener('resize', fitCanvas);
  if (window.ResizeObserver) new ResizeObserver(fitCanvas).observe(boardWrap);

  requestAnimationFrame(function () {
    fitCanvas();
    reset();
    fitCanvas();
    lastFrame = 0;
    requestAnimationFrame(render);
  });
})();
</script>
</body>
